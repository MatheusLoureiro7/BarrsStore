<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Barrs Store</title>
{% include "partials/seo_head.html" %}
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f7f6f3;--surface:#fff;--border:#e5e3de;--text:#1a1a1a;--muted:#888580;--green:#1d7a4f;--radius:14px;--radius-sm:8px}
  body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
  .num{font-family:'Playfair Display',serif;font-size:120px;font-weight:700;color:var(--border);line-height:1}
  h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;margin:16px 0 8px}
  p{font-size:14px;color:var(--muted);margin-bottom:32px}
  a{display:inline-block;padding:12px 28px;background:var(--text);color:#fff;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-weight:600;transition:opacity .2s}
  a:hover{opacity:0.85}
</style>
</head>
<body>
  <div class="num">404</div>
  <h1>Página não encontrada</h1>
  <p>A página que você procura não existe ou foi removida.</p>
  <a href="/">Voltar para a loja</a>
</body>
</html>
